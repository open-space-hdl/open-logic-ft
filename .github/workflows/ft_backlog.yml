name: FT-Backlog-Check
run-name: ${{ github.actor }} triggered FT Backlog Check

# Fork-only workflow of open-space-hdl/open-logic-ft: checks every push to the fault-tolerant
# backlog branch and every pull request against it. The job names carry the prefix ft-backlog so
# that branch protection can require them next to the upstream checks of the same pull request. The
# workflow is never part of a pull request to open-logic/open-logic.

# Set the permissions for the workflow
permissions:
  contents: read

#Set Triggers
on:
  push:
    branches:
      - fault-tolerant
  pull_request:
    branches:
      - fault-tolerant
  workflow_dispatch:

#Jobs
jobs:
  simulation:
    name: ft-backlog-ghdl-${{ matrix.area }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        area: [base, axi, intf, fix, ft]
    steps:
      #General Setup
      - name: Setup node
        uses: actions/setup-node@v7
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true
      #Setup environment
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          os: ${{ runner.os }}
      #GHDL with the mcode backend: the SEU testbenches of the synchronizers force registers inside the DUT
      #through VHDL-2008 external names. The GHDL 6.0.0 LLVM build of the upstream workflow does not support
      #them and run.py skips them there; the mcode backend runs them.
      - name: Setup GHDL
        uses: ghdl/setup-ghdl@v1
        with:
          version: latest
          backend: mcode
      #Run Simulation: all tests of the area. --minimal only limits the compilation to the files the tests of the
      #area need (the ft area compiles all), so the five jobs together are the full regression of the library.
      - name: Run Simulation
        shell: bash
        run: |
          cd ./sim
          if [ "${{ matrix.area }}" = "ft" ]; then MINIMAL=""; else MINIMAL="--minimal"; fi
          python3 run.py --ghdl $MINIMAL "olo_tb.olo_${{ matrix.area }}_*" --xunit-xml sim_report_ghdl_${{ matrix.area }}.xml -p 16
      - name: Upload sim results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulation-ghdl-${{ matrix.area }}-artifacts
          path: sim/sim_report_ghdl_${{ matrix.area }}.xml

  linting:
    name: ft-backlog-vsg
    runs-on: ubuntu-24.04
    steps:
      #General Setup
      - name: Setup node
        uses: actions/setup-node@v7
      - name: Checkout repo
        uses: actions/checkout@v7
      #Setup environment
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          os: ${{ runner.os }}
      #Run Linting
      - name: Run Linting
        shell: bash
        run: |
          cd ./lint/script
          python3 script.py
      #Upload Linting results
      - name: Upload Linting results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linting-artifacts
          path: |
            lint/report/vsg_normal_vhdl.xml
            lint/report/vsg_vc_vhdl.xml

  markdown-lint:
    name: ft-backlog-markdownlint
    runs-on: ubuntu-24.04
    steps:
      #General Setup
      - name: Checkout repo
        uses: actions/checkout@v7
      #Run markdownlint. The action v24 brings markdownlint 0.41 with the new rule MD059 (descriptive link
      #text); the upstream check md_check.yml still runs markdownlint 0.35 without it.
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          #doc/intf/olo_intf_uart.md is upstream content and fails MD059 (link text "[here]"), md_check.yml
          #lints it with the upstream settings. Remove the exclusion once upstream changes the link text.
          globs: |
            **/*.md
            !doc/intf/olo_intf_uart.md
          config: '.markdownlint.json'

  check-synthesis-config:
    name: ft-backlog-inference-coverage
    runs-on: ubuntu-24.04
    steps:
      #General Setup
      - name: Setup node
        uses: actions/setup-node@v7
      - name: Checkout repo
        uses: actions/checkout@v7
      #Setup environment
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          os: ${{ runner.os }}
      #Every ft entity must be configured or excluded in the inference test
      - name: ft
        run: |
          cd ./tools/inference_test
          python3 -u ./InferenceTest.py --yml=./yaml/ft.yml --no-tables --check-coverage --dry-run
