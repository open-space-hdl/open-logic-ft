files:
  include:
    - "../../../src/base/**/*.vhd"
    - "../../../src/ft/**/*.vhd"

exclude_entities:
  - "olo_private_*"
  - "olo_base_*"
  - "olo_ft_private_*" # Private entities

entities:

  # ============================================================
  # olo_ft_ecc_encode
  # ============================================================
  - entity_name: "olo_ft_ecc_encode"
    configurations:
      - name: "w64-pipe1"
        generics: { Width_g: 64, Pipeline_g: 1 }
        in_reduce: { In_Data: 64, ErrInj_BitFlip: 72 }
        out_reduce: { Out_Codeword: 72 }

  # ============================================================
  # olo_ft_ecc_decode
  # ============================================================
  - entity_name: "olo_ft_ecc_decode"
    configurations:
      - name: "w64-pipe2"
        generics: { Width_g: 64, Pipeline_g: 2 }
        in_reduce: { In_Codeword: 72, ErrInj_BitFlip: 72 }
        out_reduce: { Out_Data: 64 }

  # ============================================================
  # olo_ft_ram_sp
  # ============================================================
  - entity_name: "olo_ft_ram_sp"
    fixed_generics:
      Depth_g: 256
    configurations:
      - name: "w64-ecc2-lat1"
        generics: { Width_g: 64, EccPipeline_g: 2, RamRdLatency_g: 1 }
        in_reduce: { WrData: 64, ErrInj_BitFlip: 72 }
        out_reduce: { RdData: 64 }

  # ============================================================
  # olo_ft_ram_sp_scrub
  # ============================================================
  - entity_name: "olo_ft_ram_sp_scrub"
    fixed_generics:
      Depth_g: 256
    configurations:
      # Pacer ON: this representative config also exercises the strobe_gen + strobe_div cascade and
      # the g_paced generate in synthesis (ScrubClkHz_g/ScrubPeriod_g give a ~1 s period at 100 MHz).
      # olo_ft_ram_sdp_scrub keeps the pacer off, so CI synthesizes both pacer states across the two
      # scrub wrappers while staying at one config per entity.
      - name: "w64-ecc2-lat1-paced"
        generics: { Width_g: 64, EccPipeline_g: 2, RamRdLatency_g: 1, ScrubClkHz_g: 100000000.0, ScrubPeriod_g: 1.0 }
        in_reduce: { WrData: 64, ErrInj_BitFlip: 72 }
        out_reduce: { RdData: 64 }

  # ============================================================
  # olo_ft_ram_sdp
  # ============================================================
  - entity_name: "olo_ft_ram_sdp"
    fixed_generics:
      Depth_g: 256
    configurations:
      - name: "w32-ecc1-lat2"
        generics: { Width_g: 32, EccPipeline_g: 1, RamRdLatency_g: 2 }
        in_reduce: { Wr_Data: 32, ErrInj_BitFlip: 39 }
        out_reduce: { Rd_Data: 32 }

  # ============================================================
  # olo_ft_ram_sdp_scrub
  # ============================================================
  - entity_name: "olo_ft_ram_sdp_scrub"
    fixed_generics:
      Depth_g: 256
    configurations:
      # ScrubClkHz_g has no default; the value is unused here because the pacer stays off.
      - name: "w32-ecc1-lat2"
        generics: { Width_g: 32, EccPipeline_g: 1, RamRdLatency_g: 2, ScrubClkHz_g: 100000000.0 }
        in_reduce: { Wr_Data: 32, ErrInj_BitFlip: 39 }
        out_reduce: { Rd_Data: 32 }

  # ============================================================
  # olo_ft_ram_tdp
  # ============================================================
  - entity_name: "olo_ft_ram_tdp"
    fixed_generics:
      Depth_g: 256
      RamBehavior_g: '"WBR"'
    configurations:
      - name: "w32-ecc1-lat2"
        generics: { Width_g: 32, EccPipeline_g: 1, RamRdLatency_g: 2 }
        in_reduce: { A_WrData: 32, B_WrData: 32, A_ErrInj_BitFlip: 39, B_ErrInj_BitFlip: 39 }
        out_reduce: { A_RdData: 32, B_RdData: 32 }
    tool_omit:
      cologne: "TDP not supported on Cologne Chip FPGAs"

  # ============================================================
  # olo_ft_fifo_sync
  # ============================================================
  - entity_name: "olo_ft_fifo_sync"
    fixed_generics:
      Depth_g: 256
    configurations:
      - name: "w32"
        generics: { Width_g: 32 }
        in_reduce: { In_Data: 32, In_ErrInj_BitFlip: 39 }
        out_reduce: { Out_Data: 32 }

  # ============================================================
  # olo_ft_fifo_packet
  # ============================================================
  - entity_name: "olo_ft_fifo_packet"
    fixed_generics:
      Depth_g: 256
    configurations:
      # Default SmallRamStyle_g="registers": synthesizes the FF-based packet-boundary FIFO
      # (the fault-tolerant configuration, coverable by vendor TMR)
      - name: "w32"
        generics: { Width_g: 32 }
        in_reduce: { In_Data: 32, In_ErrInj_BitFlip: 39 }
        out_reduce: { Out_Data: 32 }

  # ============================================================
  # olo_ft_fifo_async
  # ============================================================
  - entity_name: "olo_ft_fifo_async"
    fixed_generics:
      Depth_g: 256
    configurations:
      - name: "w32"
        generics: { Width_g: 32 }

  # ============================================================
  # olo_ft_axi_master_simple
  # ============================================================
  - entity_name: "olo_ft_axi_master_simple"
    configurations:
      - name: "addr32-data32"
        generics: { AxiAddrWidth_g: 32, AxiDataWidth_g: 32, AxiMaxBeats_g: 16 }
        in_reduce:
          CmdWr_Addr: 32
          CmdRd_Addr: 32
          CmdWr_Size: 24
          CmdRd_Size: 24
          Wr_Data: 32
          M_Axi_RData: 32
          Wr_ErrInj_BitFlip: 43
          Rd_ErrInj_BitFlip: 40
        out_reduce:
          Rd_Data: 32
          M_Axi_AwAddr: 32
          M_Axi_ArAddr: 32
          M_Axi_WData: 32

  # ============================================================
  # olo_ft_axi_master_full
  # ============================================================
  - entity_name: "olo_ft_axi_master_full"
    configurations:
      - name: "addr32-data32"
        generics: { AxiAddrWidth_g: 32, AxiDataWidth_g: 32, UserDataWidth_g: 16, UserTransactionSizeBits_g: 24, AxiMaxBeats_g: 16 }
        in_reduce:
          CmdWr_Addr: 32
          CmdRd_Addr: 32
          CmdWr_Size: 24
          CmdRd_Size: 24
          Wr_Data: 16
          M_Axi_RData: 32
          Wr_ErrInj_BitFlip: 22
          Rd_ErrInj_BitFlip: 23
        out_reduce:
          Rd_Data: 16
          M_Axi_AwAddr: 32
          M_Axi_ArAddr: 32
          M_Axi_WData: 32

  # ============================================================
  # olo_ft_delay
  # ============================================================
  - entity_name: "olo_ft_delay"
    configurations:
      # BRAM-backed delay with the registered decode output
      - name: "w32-d256-ecc1"
        generics: { Width_g: 32, Delay_g: 256, EccPipeline_g: 1 }

  # ============================================================
  # olo_ft_delay_cfg
  # ============================================================
  - entity_name: "olo_ft_delay_cfg"
    configurations:
      - name: "w32-max256-ecc1"
        generics: { Width_g: 32, MaxDelay_g: 256, EccPipeline_g: 1 }

  # ============================================================
  # olo_ft_cc_pulse
  # ============================================================
  - entity_name: "olo_ft_cc_pulse"
    configurations:
      - name: "n8-s3"
        generics: { NumPulses_g: 8, SyncStages_g: 3 }

  # ============================================================
  # olo_ft_cc_bits
  # ============================================================
  - entity_name: "olo_ft_cc_bits"
    configurations:
      - name: "w8-s2"
        generics: { Width_g: 8, SyncStages_g: 2 }

  # ============================================================
  # olo_ft_cc_reset
  # ============================================================
  - entity_name: "olo_ft_cc_reset"
    configurations:
      - name: "s2"
        generics: { SyncStages_g: 2 }
  # ============================================================
  # olo_ft_ecc_monitor
  # ============================================================
  - entity_name: "olo_ft_ecc_monitor"
    configurations:
      - name: "ch8-w16"
        generics: { Channels_g: 8, CounterWidth_g: 16 }

  # ============================================================
  # olo_ft_ecc_monitor_axi
  # ============================================================
  - entity_name: "olo_ft_ecc_monitor_axi"
    configurations:
      - name: "ch8-w16-addr12"
        generics: { Channels_g: 8, CounterWidth_g: 16, AxiAddrWidth_g: 12 }
        in_reduce:
          S_AxiLite_ArAddr: 12
          S_AxiLite_AwAddr: 12
          S_AxiLite_WData: 32
        out_reduce:
          S_AxiLite_RData: 32
